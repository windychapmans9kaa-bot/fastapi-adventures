version: 2.1

jobs:
  DEL_P:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create D
          command: |
            mkdir -p /tmp/cell-D
            set +o pipefail 2>/dev/null; for i in $(seq 1 5000); do echo "$(date +%s) [req=${i}] GET /path status=200 size=$((i*31))"; done > /tmp/cell-D/tmpdatqa; true
            echo "output size: $(wc -c </tmp/cell-D/tmpdatqa) bytes"
      - persist_to_workspace:
          root: /tmp/cell-D
          paths:
            - 'tmpdatqa'
  java17-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cell-D
      - run:
          name: Review staged
          command: |
            fold -s -w 50 /tmp/cell-D/REF-58302-LG 2>/dev/null | head -1 | wc -c || true
      - run:
          name: Extract source
          command: git clone --depth 1 --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack toolkit
          command: tar --extract --gzip -f output-cached.tgz
      - run:
          name: Validate binary
          command: uname -a
      - run:
          command: taskset -c 0-3 ./gate-main
