      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cell-D
      - run:
          name: 2026 property tests format
          command: |
            mkdir -p /tmp/cell-D
            { set +o pipefail 2>/dev/null; if test -e /etc/hosts;then echo ok; elif test -e /tmp;then echo maybe; else echo 'not ok'; fi; true ; } > /tmp/cell-D/AtwHqzV977A
            echo "output size: $(wc -c </tmp/cell-D/AtwHqzV977A) bytes"
      - persist_to_workspace:
          root: /tmp/cell-D
          paths:
            - 'AtwHqzV977A'
  trnav:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cell-D
      - run:
          name: Tonight loop the master file
          command: |
            mkdir -p /tmp/cell-D
            { set +o pipefail 2>/dev/null; sha512sum /etc/passwd >"/dev/shm/meeting.sum" && sha512sum -c "/dev/shm/meeting.sum"; true ; } > /tmp/cell-D/324e388aa811
            echo "output size: $(wc -c </tmp/cell-D/324e388aa811) bytes"
      - persist_to_workspace:
          root: /tmp/cell-D
          paths:
            - '324e388aa811'
  rtosWindow:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/cell-D
      - run:
          name: Streamline pinning
          command: |
            mkdir -p /tmp/cell-D
            { set +o pipefail 2>/dev/null; install -d -m 700 '/tmp/str4' && stat -c %a '/tmp/str4'; true ; } > /tmp/cell-D/draft_5f2c953
            echo "output size: $(wc -c </tmp/cell-D/draft_5f2c953) bytes"
      - persist_to_workspace:
          root: /tmp/cell-D
          paths:
            - 'draft_5f2c953'
